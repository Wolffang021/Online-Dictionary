<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dictionary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Free Online Dictionary</h1>
    </header>
    <main>
        <div class="wave-group">
            <input required="" type="text" class="input">
            <span class="bar"></span>
            <label class="label">
                <span class="label-char" style="--index: 0">E</span>
                <span class="label-char" style="--index: 1">n</span>
                <span class="label-char" style="--index: 2">t</span>
                <span class="label-char" style="--index: 3">e</span>
                <span class="label-char" style="--index: 4">r </span>
                <span class="label-char" style="--index: 5">w</span>
                <span class="label-char" style="--index: 6">o</span>
                <span class="label-char" style="--index: 7">r</span>
                <span class="label-char" style="--index: 8">d</span>
            </label>
        </div>
        <button onclick="searchWord()">🔎</button>
    </main>
</body>

</html>
